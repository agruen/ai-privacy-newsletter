[project]
name = "ai-privacy-newsletter"
version = "0.1.0"
description = "Automated AI privacy incident digest — ingests incidents and drafts a monthly newsletter for human review."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
