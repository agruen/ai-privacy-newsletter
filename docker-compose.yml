services:
  app:
    build: .
    image: ai-privacy-newsletter:local
    restart: unless-stopped
    env_file:
      - .env
    # Publish the plaintext port on loopback only. For public access enable the
    # `tls` profile below (Caddy reaches the app over the internal Docker network,
    # not this published port), so credentials never traverse plaintext HTTP.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - digest_data:/data

  # Optional HTTPS reverse proxy. Enable with:
  #   docker compose --profile tls up -d
  # and set DOMAIN in your environment.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  digest_data:
  caddy_data:
  caddy_config:
